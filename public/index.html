<!-- public/index.html
---------------------------------------------------------------------
App shell: loads fonts and CSS, defines four hidden view sections
(login, mainMenu, level, roundSummary), a #modal-root for overlays that
layer over a view (Field Guide modal), and runs js/main.js.
--------------------------------------------------------------------- -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birdwatching Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/game.css" />
</head>

<body>
  <main id="app">
    <section class="view" data-view="login" hidden></section>
    <section class="view" data-view="mainMenu" hidden></section>
    <section class="view" data-view="level" hidden></section>
    <section class="view" data-view="roundSummary" hidden></section>
  </main>
  <div id="modal-root"></div>
  <script type="module" src="js/main.js"></script>
</body>

</html>
